<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCloud AiPan - 智能云盘</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 登录遮罩 -->
<div id="auth-overlay" class="auth-overlay">
  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-brand-mark"></div>
      <h1>DCloud AiPan</h1>
      <p>智能云盘系统</p>
      <span class="auth-tagline">安全 · 智能 · 高效</span>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">登录</button>
      <button class="auth-tab" data-tab="register">注册</button>
    </div>
    <form id="login-form" class="auth-form active">
      <div class="form-group">
        <label>手机号</label>
        <input type="text" id="login-phone" placeholder="输入手机号" autocomplete="tel">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="login-password" placeholder="输入密码" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">登录</button>
      <p id="login-error" class="auth-error"></p>
    </form>
    <form id="register-form" class="auth-form">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="reg-name" placeholder="输入用户名">
      </div>
      <div class="form-group">
        <label>手机号</label>
        <input type="text" id="reg-phone" placeholder="输入手机号">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="reg-password" placeholder="输入密码">
      </div>
      <button type="submit" class="btn-primary">注册</button>
      <p id="reg-error" class="auth-error"></p>
    </form>
  </div>
</div>

<!-- 主布局 -->
<div id="app" class="app-container" style="display:none">
  <!-- 活动栏 -->
  <div class="activity-bar">
    <div class="activity-item active" data-panel="files" title="文件管理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
    </div>
    <div class="activity-item" data-panel="share" title="分享管理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    </div>
    <div class="activity-item" data-panel="recycle" title="回收站">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
    </div>
    <div class="activity-divider"></div>
    <div class="activity-item" data-panel="ai-chat" title="AI 对话">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    </div>
    <div class="activity-item" data-panel="ai-doc" title="AI 文档总结">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    </div>
    <div class="activity-item" data-panel="ai-pan" title="AI 网盘查询">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </div>
    <div class="activity-spacer"></div>
    <div class="activity-item" data-panel="settings" title="个人设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </div>
  </div>

  <!-- 侧边栏 -->
  <div class="sidebar" id="sidebar">
    <!-- 文件面板 -->
    <div class="sidebar-panel active" id="panel-files">
      <div class="sidebar-header">
        <span>文件资源管理器</span>
      </div>
      <div class="sidebar-toolbar">
        <button class="icon-btn" id="btn-new-folder" title="新建文件夹">📁+</button>
        <button class="icon-btn" id="btn-upload-file" title="上传文件">📤</button>
        <button class="icon-btn" id="btn-refresh" title="刷新">🔄</button>
      </div>
      <div class="search-box">
        <input type="text" id="file-search" placeholder="搜索文件...">
      </div>
      <div class="folder-tree" id="folder-tree"></div>
    </div>

    <!-- 分享面板 -->
    <div class="sidebar-panel" id="panel-share">
      <div class="sidebar-header"><span>分享管理</span></div>
      <div class="sidebar-toolbar">
        <button class="icon-btn" id="btn-create-share" title="创建分享">🔗+</button>
      </div>
      <div class="share-list-container" id="share-list-side"></div>
    </div>

    <!-- 回收站面板 -->
    <div class="sidebar-panel" id="panel-recycle">
      <div class="sidebar-header"><span>回收站</span></div>
      <div class="sidebar-toolbar">
        <button class="icon-btn" id="btn-restore-all" title="批量还原">♻️</button>
        <button class="icon-btn" id="btn-delete-all" title="彻底删除">🗑️</button>
      </div>
      <div class="recycle-info" id="recycle-info"></div>
    </div>

    <!-- AI 对话面板 -->
    <div class="sidebar-panel" id="panel-ai-chat">
      <div class="sidebar-header"><span>AI 对话</span></div>
      <div class="ai-chat-history" id="ai-chat-history-side"></div>
    </div>

    <!-- AI 文档面板 -->
    <div class="sidebar-panel" id="panel-ai-doc">
      <div class="sidebar-header"><span>AI 文档总结</span></div>
      <div class="ai-doc-form-side">
        <div class="form-group">
          <label>文档URL</label>
          <div style="display:flex;gap:6px;"><input type="text" id="doc-url-side" placeholder="输入文档链接..." style="flex:1;"><button type="button" class="btn-sm" id="btn-pick-file-side" style="white-space:nowrap;">📁 从网盘选择</button></div>
        </div>
        <div class="form-group">
          <label>总结类型</label>
          <select id="doc-summary-type-side">
            <option value="brief">简要</option>
            <option value="detailed">详细</option>
            <option value="keypoints">要点</option>
          </select>
        </div>
        <button class="btn-primary" id="btn-doc-process-side">开始总结</button>
      </div>
    </div>

    <!-- AI 网盘查询面板 -->
    <div class="sidebar-panel" id="panel-ai-pan">
      <div class="sidebar-header"><span>AI 网盘查询</span></div>
      <div class="ai-pan-form-side">
        <div class="form-group">
          <label>自然语言查询</label>
          <textarea id="pan-query-side" rows="3" placeholder="例如：查看我的所有图片文件、统计存储空间使用情况..."></textarea>
        </div>
        <button class="btn-primary" id="btn-pan-query-side">查询</button>
      </div>
    </div>

    <!-- 设置面板 -->
    <div class="sidebar-panel" id="panel-settings">
      <div class="sidebar-header"><span>个人设置</span></div>
      <div class="user-profile" id="user-profile-side"></div>
    </div>
  </div>

  <!-- 主内容区 -->
  <div class="main-content" id="main-content">
    <!-- 标签栏 -->
    <div class="tabs-bar" id="tabs-bar"></div>
    <!-- 面包屑 -->
    <div class="breadcrumb" id="breadcrumb"></div>
    <!-- 工具栏 -->
    <div class="toolbar" id="toolbar"></div>
    <!-- 内容区 -->
    <div class="content-area" id="content-area"></div>
  </div>

  <!-- 底部面板 -->
  <div class="bottom-panel" id="bottom-panel">
    <div class="bottom-tabs">
      <button class="bottom-tab active" data-bottom="ai-chat">AI 对话</button>
      <button class="bottom-tab" data-bottom="ai-doc">文档总结</button>
      <button class="bottom-tab" data-bottom="ai-pan">网盘查询</button>
      <button class="bottom-tab" data-bottom="terminal">输出</button>
    </div>
    <div class="bottom-content">
      <div class="bottom-panel-content active" id="bottom-ai-chat">
        <div class="chat-container">
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input-area">
            <textarea id="chat-input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行..."></textarea>
            <button class="btn-primary" id="btn-chat-send">发送</button>
          </div>
        </div>
      </div>
      <div class="bottom-panel-content" id="bottom-ai-doc">
        <div class="doc-container">
          <div class="doc-input-area">
            <input type="text" id="doc-url" placeholder="输入文档URL..."><button type="button" class="btn-sm" id="btn-pick-file" style="white-space:nowrap;">📁 从网盘选择</button>
            <select id="doc-summary-type">
              <option value="brief">简要</option>
              <option value="detailed">详细</option>
              <option value="keypoints">要点</option>
            </select>
            <select id="doc-language">
              <option value="zh">中文</option>
              <option value="en">英文</option>
            </select>
            <button class="btn-primary" id="btn-doc-process">开始总结</button>
          </div>
          <div class="doc-result" id="doc-result"></div>
        </div>
      </div>
      <div class="bottom-panel-content" id="bottom-ai-pan">
        <div class="pan-container">
          <div class="pan-input-area">
            <textarea id="pan-query" rows="2" placeholder="自然语言查询，例如：查看我的所有图片文件..."></textarea>
            <button class="btn-primary" id="btn-pan-query">查询</button>
          </div>
          <div class="pan-result" id="pan-result"></div>
        </div>
      </div>
      <div class="bottom-panel-content" id="bottom-terminal">
        <div class="terminal" id="terminal-output"></div>
      </div>
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar">
    <div class="status-left">
      <span id="status-user">未登录</span>
    </div>
    <div class="status-center">
      <span id="status-storage">存储: --</span>
    </div>
    <div class="status-right">
      <span id="status-backend">后端: --</span>
      <span class="status-separator">|</span>
      <span id="status-ai">AI: --</span>
    </div>
  </div>
</div>

<!-- 模态层 -->
<div class="modal-overlay" id="modal-overlay" style="display:none">
  <div class="modal" id="modal-content"></div>
</div>

<!-- 右键菜单 -->
<div class="context-menu" id="context-menu" style="display:none"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/files.js"></script>
<script src="js/share.js"></script>
<script src="js/recycle.js"></script>
<script src="js/ai.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
