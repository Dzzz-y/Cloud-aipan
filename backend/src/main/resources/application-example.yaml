# ⚠️ 这是配置模板，实际运行时请复制为 application.yaml 并填入真实值

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://<YOUR_MYSQL_HOST>:3306/app_db
    username: <YOUR_DB_USERNAME>
    password: <YOUR_DB_PASSWORD>
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: <YOUR_REDIS_HOST>
      port: 6379
      password: <YOUR_REDIS_PASSWORD>

minio:
  endpoint: http://<YOUR_MINIO_HOST>:9000
  access-key: <YOUR_MINIO_ACCESS_KEY>
  secret-key: <YOUR_MINIO_SECRET_KEY>

ai:
  dashscope:
    api-key: <YOUR_DASHSCOPE_API_KEY>

stream:
  service:
    base-url: http://<YOUR_AI_AGENT_HOST>:8000
